name: Mindshare Scan

on:
  schedule:
    # Every 10 minutes
    - cron: '*/10 * * * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r scripts/tg-mindshare/requirements.txt

      - name: Run scan
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_SESSION_STRING: ${{ secrets.TG_SESSION_STRING }}
          API_URL: ${{ secrets.MINDSHARE_API_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SCAN_MINUTES: '12'
        run: python scripts/tg-mindshare/scan.py

# [2026-08-07] A disabled `aggregate` job used to sit here with an empty steps
# list. Actions requires every job to declare at least one step, so it failed
# schema validation — which invalidates the WHOLE workflow, not just that job.
# The scheduled trigger therefore never fired: 200 runs, 200 failures, zero
# successes since the file was written on Mar 20. The only entries in the run
# history were GitHub reporting the bad file against each push.
# Weekly aggregation already lives in mindshare-aggregate.yml; the stub was
# dead weight. Don't re-add an empty job to "disable" something — delete it,
# or gate it with `if:` AND give it a real step.
